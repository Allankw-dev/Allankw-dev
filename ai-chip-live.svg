<svg width="1400" height="600" viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="1400" height="600" rx="24" ry="24"/>
    </clipPath>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanGradientPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b00ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5b00ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5b00ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base photo -->
  <g clip-path="url(#roundedClip)">
    <image href="https://images.unsplash.com/photo-1744640326166-433469d102f2?q=80&amp;w=1400&amp;auto=format&amp;fit=crop"
           x="0" y="0" width="1400" height="600" preserveAspectRatio="xMidYMid slice"/>

    <!-- moving scan-line sweep, cyan -->
    <rect x="-400" y="0" width="400" height="600" fill="url(#scanGradient)">
      <animateTransform attributeName="transform" type="translate"
                         from="-400 0" to="1400 0" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- moving scan-line sweep, purple, offset timing for depth -->
    <rect x="-400" y="0" width="400" height="600" fill="url(#scanGradientPurple)">
      <animateTransform attributeName="transform" type="translate"
                         from="-400 0" to="1400 0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <!-- subtle dark vignette so border glow reads clearly -->
    <rect x="0" y="0" width="1400" height="600" fill="black" opacity="0.08"/>
  </g>

  <!-- pulsing neon border -->
  <rect x="5" y="5" width="1390" height="590" rx="22" ry="22"
        fill="none" stroke="#00F7FF" stroke-width="5" filter="url(#neonGlow)">
    <animate attributeName="stroke" values="#00F7FF;#5b00ff;#00F7FF" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
