<svg width="500" height="600" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="roundedClipR">
      <rect x="0" y="0" width="500" height="600" rx="24" ry="24"/>
    </clipPath>
    <filter id="neonGlowR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scanGradientR1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b00ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5b00ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5b00ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGradientR2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#roundedClipR)">
    <image href="https://images.unsplash.com/photo-1617791160536-598cf32026fb?q=80&amp;w=800&amp;auto=format&amp;fit=crop"
           x="0" y="0" width="500" height="600" preserveAspectRatio="xMidYMid slice"/>

    <!-- vertical scan sweep, top to bottom -->
    <rect x="0" y="-300" width="500" height="300" fill="url(#scanGradientR1)">
      <animateTransform attributeName="transform" type="translate"
                         from="0 -300" to="0 600" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="-300" width="500" height="300" fill="url(#scanGradientR2)">
      <animateTransform attributeName="transform" type="translate"
                         from="0 -300" to="0 600" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="500" height="600" fill="black" opacity="0.06"/>
  </g>

  <rect x="5" y="5" width="490" height="590" rx="22" ry="22"
        fill="none" stroke="#5b00ff" stroke-width="5" filter="url(#neonGlowR)">
    <animate attributeName="stroke" values="#5b00ff;#00F7FF;#5b00ff" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
